name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend tests (.NET 10)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run backend tests
        run: dotnet test backend/tests/Butcher.Api.Tests/Butcher.Api.Tests.csproj --configuration Release

  frontend-build-and-test:
    name: Frontend build + unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Unit tests
        working-directory: ./frontend
        run: npm run test:unit -- --run --passWithNoTests

      - name: Build
        working-directory: ./frontend
        run: npm run build
