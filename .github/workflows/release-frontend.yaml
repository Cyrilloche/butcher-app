name: Release Frontend

on:
  push:
    tags:
      - "frontend-v*.*.*"

jobs:
  build-and-push:
    name: Build and push frontend image
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#frontend-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # Explicit version pinning. No 'latest' tag used.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-frontend:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-frontend:buildcache,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update compose file and deploy frontend
        run: |
          set -e
          cp docker-compose.prod.yml /opt/butcher-app/docker-compose.yml
          cd /opt/butcher-app
          sed -i "s|^FRONTEND_VERSION=.*|FRONTEND_VERSION=${{ needs.build-and-push.outputs.version }}|" .env
          docker compose pull frontend
          docker compose up -d frontend
