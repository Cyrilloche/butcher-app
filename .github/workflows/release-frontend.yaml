name: Release Frontend

on:
  push:
    tags:
      - "frontend-v*.*.*"

jobs:
  build-and-push:
    name: Build and push frontend image
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#frontend-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          # Explicit version pinning. No 'latest' tag used.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-frontend:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-frontend:buildcache,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update compose file and deploy frontend
        run: |
          set -e
          cp docker-compose.prod.yml /opt/butcher-app/docker-compose.yml
          cd /opt/butcher-app
          sed -i "s|^FRONTEND_VERSION=.*|FRONTEND_VERSION=${{ needs.build-and-push.outputs.version }}|" .env
          docker compose pull frontend
          docker compose up -d frontend

  release-notes:
    name: Publish GitHub release notes
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # git-cliff a besoin de tout l'historique et de tous les tags.
          fetch-depth: 0

      - name: Build changelog for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Notes de la plage `<tag frontend précédent>..<nouveau tag>`. Pas de
          # filtre par chemin : `--include-path` écrase la plage dans git-cliff
          # 2.x (il rejoue tout l'historique). Chaque ligne porte son scope
          # (**frontend**, **deploy**...), ce qui suffit à situer les changements.
          previous=$(git tag --list 'frontend-v*' --sort=-v:refname | grep -v "^$GITHUB_REF_NAME$" | head -n1 || true)
          range="$GITHUB_REF_NAME"
          if [ -n "$previous" ]; then range="$previous..$GITHUB_REF_NAME"; fi
          npx -y git-cliff@2 --config cliff.toml --strip header --tag "$GITHUB_REF_NAME" --output RELEASE_NOTES.md "$range"
          if ! grep -q '^- ' RELEASE_NOTES.md; then
            echo "Aucun changement conventionnel depuis $previous." > RELEASE_NOTES.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Frontend ${{ needs.build-and-push.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
