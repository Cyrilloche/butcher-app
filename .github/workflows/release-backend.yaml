name: Release Backend

on:
  push:
    tags:
      - "backend-v*.*.*"

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # Explicit version pinning. No 'latest' tag used.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-backend:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/butcher-app-backend:buildcache,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update compose file and deploy backend
        run: |
          set -e
          cp docker-compose.prod.yml /opt/butcher-app/docker-compose.yml
          cd /opt/butcher-app
          sed -i "s|^BACKEND_VERSION=.*|BACKEND_VERSION=${{ needs.build-and-push.outputs.version }}|" .env
          docker compose pull backend
          docker compose up -d backend
