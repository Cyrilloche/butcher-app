server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Assets réels : jamais de fallback SPA — un fichier manquant doit rendre un
    # vrai 404, sinon Cloudflare met en cache la page index.html à sa place
    # (comportement déjà rencontré une fois avec les icônes PWA).
    location ~* \.(?:png|ico|svg|webmanifest|js|css|woff2?|json)$ {
        try_files $uri =404;
    }

    # `location = ` (match exact) et non un préfixe : nginx évalue les locations
    # regex AVANT les préfixes non exacts, donc la règle `\.js$` ci-dessus captait
    # sw.js et le Cache-Control ne s'appliquait jamais. Résultat : un service
    # worker servi depuis le cache HTTP, et une mise à jour de PWA qui n'arrivait
    # qu'après vidage manuel du cache.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Même raison pour le point d'entrée : sans en-tête explicite, le navigateur
    # (et Cloudflare) peuvent resservir un index.html périmé, qui référence les
    # anciens bundles hachés. Les assets hachés, eux, restent cachables à vie.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
