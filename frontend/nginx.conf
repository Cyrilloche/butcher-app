server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Assets réels : jamais de fallback SPA — un fichier manquant doit rendre un
    # vrai 404, sinon Cloudflare met en cache la page index.html à sa place
    # (comportement déjà rencontré une fois avec les icônes PWA).
    location ~* \.(?:png|ico|svg|webmanifest|js|css|woff2?|json)$ {
        try_files $uri =404;
    }

    location /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
